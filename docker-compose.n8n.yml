# Local n8n + Browserless for the Amazon deals import (specs/product.md, n8n/README.md).
#   pnpm n8n:up       start both services (n8n on http://localhost:5678)
#   pnpm n8n:import   import n8n/workflows/amazon-deals-import.json (unpublished:
#                     manual runs only; pnpm n8n:schedule:on turns on the daily run)
#   pnpm n8n:down     stop them (the n8n_data volume keeps the workflow)
# Values like PRODUCTS_IMPORT_TOKEN are read from the shell or from .env.local (the
# pnpm scripts pass --env-file .env.local); it must match the app's token.
name: product-review-n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.6
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Optional Schedule Trigger (off until pnpm n8n:schedule:on) runs at 00:00 Sao Paulo time
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # The workflow reads APP_URL, BROWSERLESS_URL and the tokens with $env
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # The app on this machine by default; https://<project>.vercel.app for the deployed one
      APP_URL: ${APP_URL:-http://host.docker.internal:3000}
      BROWSERLESS_URL: http://browserless:3000
      BROWSERLESS_TOKEN: ${BROWSERLESS_TOKEN:-local-browserless-token}
      PRODUCTS_IMPORT_TOKEN: ${PRODUCTS_IMPORT_TOKEN:-}
      # Optional comma-separated slugs ("tvs,books") to import only some categories
      DEALS_CATEGORIES: ${DEALS_CATEGORIES:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - browserless

  browserless:
    image: ghcr.io/browserless/chromium:v2.57.1
    restart: unless-stopped
    # Only reachable from n8n; uncomment to call it from the host while debugging
    # ports:
    #   - "3001:3000"
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:-local-browserless-token}
      CONCURRENT: "1"
      QUEUED: "10"
      # A category page with scrolling takes ~20-40 s
      TIMEOUT: "120000"

volumes:
  n8n_data:
